<div>
    <h1>Cooker: Recipes</h1>
    <ul>
        {% for recipe in recipes %}
        <li>
            <a href={{ url_for('recipes.show', recipe_id=recipe.id)}}>
                {{ recipe.title }}

            </a>
            {% if recipe.author %}
                by {{ recipe.author.username }}
            {% endif %}
        </li>
        {% else %}
        <li>No Recipes Yet</li>
        {% endfor %}
    </ul>

</div>
