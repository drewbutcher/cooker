<h1>Test Kitchen Recipe Edit: <a href="{{ url_for('test_kitchen.recipes.show', recipe_id=recipe.id) }}">{{ recipe.title }}</a></h1>

<p>
    <ul>
        <li><a href="{{ url_for('test_kitchen.recipes.index') }}">Test Kitchen Recipes</a></li>
    </ul>
</p>

<h2>Edit Recipe Form</h2>
<form method="POST" action="{{ url_for('test_kitchen.recipes.update', recipe_id=recipe.id) }}">
    <div>
        <label for="title">Title:</label>
        <input type="text" name="title" id="title" value="{{recipe.title}}">
    </div>
    <div>
        <label for="author_id">Author:</label>
        <select name="author_id" id="author_id">
            {% for user in users %}
                <option value="{{ user.id }}" {% if recipe.author_id == user.id %} selected {% endif %}>{{ user.username }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit">Update Recipe</button>
</form>
